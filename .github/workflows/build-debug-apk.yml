# On-demand debug APK for low-spec dev machines.
# Run manually: Actions -> Build Debug APK -> Run workflow.
# No secrets needed (debug signing is automatic). Result appears under
# the run's Artifacts as `field-officer-debug-apk`.
name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :cmp-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: field-officer-debug-apk
          path: cmp-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
